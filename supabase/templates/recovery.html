<!doctype html>
<html>
<body style="font-family:Arial,sans-serif;background:#faf7f5;padding:40px">
  <div style="max-width:560px;margin:auto;background:white;padding:32px;border-radius:18px">
    <h2>Ishqiya password reset</h2>
    <p>A password reset was requested for your Ishqiya account.</p>
    <p>
      <a
        href="https://ishqiya-sepia.vercel.app/auth/admin/recovery-bridge#u={{ .ConfirmationURL }}"
        style="display:inline-block;padding:14px 22px;background:#111;color:white;text-decoration:none;border-radius:10px"
      >
        Continue password reset
      </a>
    </p>
    <p style="color:#777;font-size:13px">
      If you did not request this, ignore this email.
    </p>
  </div>
</body>
</html>
